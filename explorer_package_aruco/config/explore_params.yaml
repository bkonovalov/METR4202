# Parameters for the three exploration nodes.  Edit and re-launch; no rebuild
# needed if you built with --symlink-install.
frontier_detector:
  ros__parameters:
    robot_frame: base_footprint
    update_period: 2.0
    robot_radius: 0.22        # goal clearance from walls (Nav2 default footprint)
    reach_clearance: 0.17     # clearance used for the reachability flood-fill
    min_frontier_size: 8      # cells; smaller clusters are treated as noise
    goal_search_radius: 0.75
    min_goal_distance: 0.3
    info_gain_weight: 0.5     # 0.0 = pure nearest-frontier

waypoint_commander:
  ros__parameters:
    goal_timeout: 120.0
    progress_timeout: 30.0
    blacklist_radius: 0.5
    preempt_explored_goals: true
    spin_on_arrival: true     # 360 deg look-around so the camera sees the walls
    return_home: true

aruco_detector:
  ros__parameters:
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    camera_frame: ""          # "" = use the image header frame_id
    frame_is_optical: true
    dictionary: DICT_6X6_250
    marker_size: 0.10
    max_range: 3.0
    min_detections: 3
    output_file: /tmp/aruco_markers.json
